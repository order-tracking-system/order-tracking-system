
{% extends 'base.html' %}

{% block content %}

<div class="card dashboard-card">
    <div class="card-header">
        <h3>New Order</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <!-- Client Name -->
                <div class="col-md-6 mb-3">
                    <label>Client Name</label>
                    <input class="form-control" name="client_name" required>
                </div>

                <!-- Mobile -->
                <div class="col-md-6 mb-3">
                    <label>Contact Number</label>
                    <input class="form-control" name="mobile">
                </div>

                <!-- Product -->
                <div class="col-md-6 mb-3">
                    <label>Product</label>
                    <input class="form-control" name="product">
                </div>

                <!-- Size -->
                <div class="col-md-6 mb-3">
                    <label>Size</label>
                    <input class="form-control" name="size">
                </div>

                <!-- Quantity -->
                <div class="col-md-12 mb-3">
                    <label>Quantity</label>
                    <input
                        type="number"
                        class="form-control"
                        name="quantity"
                        min="0">
                </div>

                <!-- ============================== -->
                <!-- INSIDE PRINTING -->
                <!-- ============================== -->

                <div class="col-md-12 mb-3">

                    <div class="card p-3">

                        <h5 class="mb-3">Inside Printing</h5>

                        <!-- Process Type -->
                        <div id="insideProcessContainer">

                            <div class="inside-process-row mb-3">

                                <label>Process Type</label>

                                <div class="input-group">

                                    <select
                                        class="form-control"
                                        name="inside_process">

                                        <option value="">Select</option>
                                        <option>UV</option>
                                        <option>Matte Lamination</option>
                                        <option>UV+Matte Lamination</option>
                                        <option>Drip-Off</option>
                                        <option>Glossy Lamination</option>
                                        <option>Emboss</option>
                                        <option>Other</option>

                                    </select>

                                    <button
                                        type="button"
                                        class="btn btn-purple"
                                        onclick="addInsideProcess()">
                                        +
                                    </button>

                                </div>

                            </div>

                        </div>

                        <!-- Paper GSM -->
                        <label>Paper GSM</label>

                        <input
                            type="text"
                            class="form-control"
                            name="inside_gsm">

                        <br>

                        <!-- Color Type -->
                        <label>Color Type</label>

                        <select
                            class="form-control"
                            name="inside_color">

                            <option>Single Color</option>
                            <option>Multi Color</option>

                        </select>

                    </div>

                </div>

                <!-- ============================== -->
                <!-- ASSIGN DESIGNER -->
                <!-- ============================== -->

                <div class="col-md-6 mb-3">

                    <label>Assign Designer</label>

                    <input
                        type="text"
                        class="form-control"
                        name="staff_name"
                        list="designerList"
                        placeholder="Type designer name"
                        required>

                    <datalist id="designerList">

                        {% for designer in designers %}

                            <option value="{{ designer.username }}">
                                {{ designer.name }}
                            </option>

                        {% endfor %}

                    </datalist>

                </div>

                <!-- ============================== -->
                <!-- ORDER BY -->
                <!-- ============================== -->

                <div class="col-md-6 mb-3">

                    <label>Order By</label>

                    <input
                        type="text"
                        class="form-control"
                        name="order_by"
                        placeholder="Enter staff name">

                </div>

                <!-- ============================== -->
                <!-- RATE PER PIECE -->
                <!-- ============================== -->

                <div class="col-md-6 mb-3">

                    <label>Rate / Piece</label>

                    <input
                        type="number"
                        class="form-control"
                        name="rate"
                        placeholder="Enter rate per piece"
                        step="0.01"
                        min="0">

                </div>

                <!-- Order Date -->
                <div class="col-md-6 mb-3">

                    <label>Order Date</label>

                    <input
                        type="date"
                        class="form-control"
                        name="order_date"
                        required>

                </div>

                <!-- Delivery Date -->
                <div class="col-md-6 mb-3">

                    <label>Delivery Date</label>

                    <input
                        type="date"
                        class="form-control"
                        name="delivery_date">

                </div>

                <!-- Notes -->
                <div class="col-md-12 mb-3">

                    <label>Other Notes</label>

                    <textarea
                        class="form-control"
                        name="remarks"
                        rows="4"></textarea>

                </div>

            </div>

            <!-- Save -->
            <button
                type="submit"
                class="btn btn-purple">

                Save Order

            </button>

        </form>

    </div>
</div>

<!-- ============================== -->
<!-- JAVASCRIPT -->
<!-- ============================== -->

<script>

function addInsideProcess() {

    const container =
        document.getElementById("insideProcessContainer");

    const row =
        document.createElement("div");

    row.className =
        "inside-process-row mb-3";

    row.innerHTML = `

        <label>Process Type</label>

        <div class="input-group">

            <select
                class="form-control"
                name="inside_process">

                <option value="">Select</option>
                <option>UV</option>
                <option>Matte Lamination</option>
                <option>UV+Matte Lamination</option>
                <option>Drip-Off</option>
                <option>Glossy Lamination</option>
                <option>Emboss</option>
                <option>Other</option>

            </select>

            <button
                type="button"
                class="btn btn-danger"
                onclick="this.closest('.inside-process-row').remove()">

                −

            </button>

        </div>

    `;

    container.appendChild(row);
}

</script>

{% endblock %}
