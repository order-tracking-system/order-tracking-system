```html
{% extends 'base.html' %}

{% block content %}

<div class="card dashboard-card">

    <div class="card-header">
        <h3 class="mb-0">🚚 Dispatch Entry</h3>
    </div>

    <div class="card-body">

        <form method="POST"
              action="{{ url_for('dispatch', id=order.id) }}">

            <div class="mb-3">
                <label class="form-label">
                    Transport Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="transport_name"
                    placeholder="Enter Transport Name"
                    value="{{ order.transport_name or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    LR Number
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="lr_number"
                    placeholder="Enter LR Number"
                    value="{{ order.lr_number or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Invoice Number
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="invoice_number"
                    placeholder="Enter Invoice Number"
                    value="{{ order.invoice_number or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Dispatch Date
                </label>

                <input
                    type="date"
                    class="form-control"
                    name="dispatch_date"
                    value="{{ order.dispatch_date or '' }}"
                >
            </div>

            <button
                type="submit"
                class="btn btn-purple">
                Save Dispatch
            </button>

            <a
                href="{{ url_for('order_detail', id=order.id) }}"
                class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
```
